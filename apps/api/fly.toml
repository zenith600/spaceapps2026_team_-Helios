# fly launch --no-deploy --copy-config ; fly deploy --dockerfile apps/api/Dockerfile (run from repo root)
app = "deepfield-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  DEMO_MODE = "1"
  DATA_DIR = "/app/data/release"
  CORS_ORIGINS = "*"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
