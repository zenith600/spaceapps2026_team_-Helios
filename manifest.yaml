# Deep Field dataset provenance manifest.
# Every network fetch in this repo must target a domain listed here.
# scripts/check_manifest_domains.py fails CI if code references a domain that is not.
# The runtime guard in pipeline/deepfield/data/manifest.py refuses requests to anything else.

version: 1
rule: >
  Only open datasets listed below may be used. NASA sources first. No dataset,
  mission, model weights or service produced by or associated with China.
  No pretrained third-party ML weights.

datasets:
  - id: spherex_dr1
    name: SPHEREx DR1 Level 2 spectral images (and QR3)
    owner: NASA / JPL / Caltech-IPAC (IRSA)
    country: USA
    licence: Public domain (NASA data policy); cite DOI 10.26131/IRSA652 (QR2) and the DR1 DOI
    access:
      - "https://irsa.ipac.caltech.edu/SIA"
      - "https://irsa.ipac.caltech.edu/ibe/data/spherex/"
      - "https://nasa-irsa-spherex.s3.us-east-1.amazonaws.com/"
    domains: [irsa.ipac.caltech.edu, nasa-irsa-spherex.s3.us-east-1.amazonaws.com, nasa-irsa-spherex.s3.amazonaws.com]
    used_for: search images, flags, variance, PSF, per-pixel wavelength

  - id: jpl_horizons
    name: JPL Horizons ephemeris API
    owner: NASA JPL
    country: USA
    licence: Public domain
    access: ["https://ssd.jpl.nasa.gov/api/horizons.api"]
    domains: [ssd.jpl.nasa.gov]
    used_for: SPHEREx spacecraft (-163182) and Earth heliocentric positions at each exposure

  - id: jpl_sbident
    name: JPL Small-Body Identification API
    owner: NASA JPL
    country: USA
    licence: Public domain
    access: ["https://ssd-api.jpl.nasa.gov/sb_ident.api"]
    domains: [ssd-api.jpl.nasa.gov]
    used_for: known asteroids and comets in each patch

  - id: p9_reference_population
    name: Planet Nine reference population, Version 3.0 (Brown 2023)
    owner: Caltech (CaltechDATA), Michael Brown
    country: USA
    licence: CC BY 4.0
    doi: 10.22002/8fjad-x7y61
    access: ["https://data.caltech.edu/records/8fjad-x7y61/files/reference_population.csv"]
    md5: a38fa7579b4c9938b3deebecda55a845
    domains: [data.caltech.edu]
    used_for: 100,000 synthetic Planet Nine orbits with ZTF/DES/PS1 exclusion flags

  - id: irsa_2mass
    name: 2MASS point source catalog (optional, stretch)
    owner: NASA / NSF (IRSA)
    country: USA
    licence: Public domain
    access: ["https://irsa.ipac.caltech.edu/TAP"]
    domains: [irsa.ipac.caltech.edu]
    used_for: static star masking (stretch)

  - id: irsa_obscore_tap
    name: IRSA ObsTAP (ivoa.obscore) collection discovery
    owner: NASA / NSF (IRSA)
    country: USA
    licence: Public domain
    access: ["https://irsa.ipac.caltech.edu/TAP/sync"]
    domains: [irsa.ipac.caltech.edu]
    used_for: >
      discovering which SPHEREx collections IRSA currently publishes
      (spherex_dr1, spherex_qr3, ...) so the Sky Viewer picks up a new data
      release with no code change
    verified: "2026-11-14 returns spherex_dr1, spherex_dr1_cal, spherex_dr1_cube, spherex_dr1_deep, spherex_qr3, spherex_qr3_deep"

  - id: cds_sesame
    name: CDS Sesame name resolver (SIMBAD / NED / VizieR)
    owner: Centre de Donnees astronomiques de Strasbourg (CNRS / Universite de Strasbourg)
    country: France
    licence: Free for research and education (CDS terms of use)
    access: ["https://cds.unistra.fr/cgi-bin/nph-sesame/-oI/SNV"]
    # cds.unistra.fr 302-redirects to whichever VizieR mirror its load balancer picks.
    # Listed below are the mirrors we accept. The China-VO mirror (vizier.china-vo.org)
    # is deliberately NOT listed: the redirect guard in data/manifest.py checks every
    # hop, so if CDS ever sends us there the fetch is refused and name resolution falls
    # back to the offline catalogue. Verified 2026-11-14: cds.unistra.fr -> vizier.idia.ac.za.
    domains:
      - cds.unistra.fr
      - cdsweb.u-strasbg.fr
      - vizier.cds.unistra.fr      # France (CDS)
      - vizier.cfa.harvard.edu     # USA (Harvard CfA)
      - vizier.idia.ac.za          # South Africa (IDIA)
      - vizier.nao.ac.jp           # Japan (NAOJ)
      - vizier.iucaa.in            # India (IUCAA)
    excluded_mirrors:
      - vizier.china-vo.org        # refused by the project rule
    optional: true
    used_for: >
      resolving an object name typed by the user into RA/Dec. Optional: the
      five challenge test targets and a built-in catalogue resolve offline with
      no network call. CDS is the author of the Aladin tool the challenge brief
      recommends; it is not a Chinese source, so the project rule is satisfied.
    verified: "2026-11-14 Barnard's Star -> 269.45208 +4.69336; RW Aur -> 76.95653 +30.40144; R Dra -> 248.16761 +66.75498"

  - id: irsa_wise_catalogs
    name: AllWISE and unWISE source catalogues (IRSA TAP)
    owner: NASA / IPAC (IRSA)
    country: USA
    licence: Public domain (NASA data policy)
    access: ["https://irsa.ipac.caltech.edu/TAP/sync"]
    domains: [irsa.ipac.caltech.edu]
    used_for: >
      overlaying known infrared sources on a Sky Viewer field, so a user can tell a
      catalogued star from something unidentified

  - id: esa_gaia_tap
    name: Gaia DR3 source catalogue (ESA Gaia Archive TAP)
    owner: European Space Agency
    country: International (ESA, Spain)
    licence: ESA Gaia Data Licence (free re-use with attribution)
    access: ["https://gea.esac.esa.int/tap-server/tap/sync"]
    domains: [gea.esac.esa.int]
    optional: true
    used_for: >
      precise positions, magnitudes and proper motions overlaid on a field. The brief
      suggests Gaia explicitly. Optional: the viewer works without it.

  - id: cds_aladin_lite
    name: Aladin Lite v3 sky atlas (CDS)
    owner: Centre de Donnees astronomiques de Strasbourg (CNRS)
    country: France
    licence: GPL-3.0 (Aladin Lite); HiPS imagery under its own survey terms
    # The library itself is bundled from npm (aladin-lite 3.8.2, pinned), not fetched from CDS:
    # the hosted path https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js was
    # retired (404, checked 2026-11-14) and took the panel down with it.
    # Sky imagery: on 2026-11-14 every CDS survey on alasky.cds.unistra.fr returned 404 and
    # alaskybis timed out. The surveys' own records list IRSA as an official mirror, so the
    # panel names its surveys (2MASS, AllWISE, DSS2) by IRSA URL. IRSA is the NASA archive
    # all SPHEREx data here already comes from, and is covered by the spherex_dr1 entry.
    access: ["npm:aladin-lite@3.8.2", "https://irsa.ipac.caltech.edu/data/hips/CDS/"]
    domains: [aladin.cds.unistra.fr, alasky.cds.unistra.fr, alaskybis.cds.unistra.fr, alasky.unistra.fr]
    optional: true
    used_for: >
      optional "where is this on the sky" context panel, loaded in the browser only when
      the user asks for it. The brief recommends this tool by name.

  - id: llm_field_explanations
    name: OpenAI-compatible chat completions (NVIDIA-hosted gpt-oss-20b)
    owner: NVIDIA (hosting), OpenAI (open-weight model)
    country: USA
    licence: Apache-2.0 model weights; NVIDIA API terms
    access: ["https://integrate.api.nvidia.com/v1/chat/completions"]
    domains: [integrate.api.nvidia.com]
    optional: true
    used_for: >
      writing the plain-language "what to look for" line for a coordinate that is not in
      the built-in catalogue. It is given measured facts only and is never part of the
      science pipeline.
    note: >
      This is a text service, not a source of science. The project rule "no pretrained
      third-party ML weights" still holds for everything that touches the data: the
      real/bogus classifier and the spectrum classifier are both trained from scratch on
      our own injections and templates. PLAN.md section 1.6 flags the open question of
      whether the rule is meant to cover AI services at all; if organisers say it does,
      set LLM_API_KEY empty and the viewer falls back to showing measured facts only.

# Hosting / tooling domains that are not datasets but may appear in code or config.
infrastructure_domains:
  - api.anthropic.com      # dossier agent (Claude API), optional
  - supabase.co            # crowd database, optional
  - vercel.app
  - fly.dev
  - localhost
  - 127.0.0.1
  - api                    # docker-compose service name
  - web
