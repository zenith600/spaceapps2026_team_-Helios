name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt -r apps/api/requirements.txt
      - name: manifest allowlist check
        run: python scripts/check_manifest_domains.py
      - name: tests
        env: { PYTHONPATH: "pipeline:apps/api", DEMO_MODE: "1" }
        run: python -m pytest tests -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXT_PUBLIC_DEMO_MODE: "1" }
